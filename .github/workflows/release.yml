name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs needs the tag to compute the version
      - uses: astral-sh/setup-uv@v5
      # Build FIRST, on the pristine checkout, so hatch-vcs computes the exact
      # tag version (running uv/pytest first can rewrite uv.lock and dirty the
      # tree, producing a PyPI-rejected local/dev version).
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Test
        run: uv run --group dev pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): no API token. Register this repo + the "pypi"
    # environment as a trusted publisher in the PyPI project's settings.
    environment:
      name: pypi
      url: https://pypi.org/p/chamfer-cad
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
